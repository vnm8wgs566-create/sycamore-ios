# XcodeGen spec for the Sycamore iOS app.
#
# `Sycamore.xcodeproj` is checked in and is the primary artefact; this file is the fallback
# for regenerating it from scratch:
#
#     brew install xcodegen && xcodegen generate
#
# Keep the two in step — bundle id, deployment target, Info.plist path and device family are
# duplicated between them by necessity.

name: Sycamore

options:
  bundleIdPrefix: com.cjgimena
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "1600"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # No SWIFT_STRICT_CONCURRENCY here on purpose: SWIFT_VERSION 6.0 already implies
    # complete checking, and stating it separately is what let this file drift out of
    # step with the checked-in pbxproj, which sets only SWIFT_VERSION.

targets:
  Sycamore:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    # `Config/` is deliberately not a source. The Info.plist and the entitlements are consumed by
    # *path* — `INFOPLIST_FILE` and `CODE_SIGN_ENTITLEMENTS` below — and never by target
    # membership, so the only thing including them here could do is ship a second copy inside
    # the .app. See the note on `CODE_SIGN_ENTITLEMENTS` for why they had to leave `Sycamore/`.
    sources:
      - path: Sycamore
        excludes:
          # Instructions for dropping the Manrope faces in — documentation, not a resource.
          # Without this the synchronised group ships it inside the .app. This one stays: its
          # whole point is to sit where the fonts go, and a stray README in the bundle is a
          # kilobyte of nothing rather than a signing claim.
          - "Resources/Fonts/README.md"

    settings:
      base:
        PRODUCT_NAME: Sycamore
        # Must match the App ID registered under DEVELOPMENT_TEAM below, the App ID that has
        # Sign In with Apple ticked, and the Apple provider's Client ID in Supabase. All four
        # are the same string; a mismatch in any of them is rejected at a different layer.
        PRODUCT_BUNDLE_IDENTIFIER: com.cjgimena.app
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # 1 = iPhone. The design is portrait phone only.
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_STYLE: Automatic
        # The catalog holds exactly one thing — the 3e mark at 1024, regenerated by
        # Scripts/make-app-icon.py. iOS masks the corners, so the PNG is a full square.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Required to build for a physical device — automatic signing still needs to know
        # which team to request a provisioning profile from. Simulator builds don't.
        DEVELOPMENT_TEAM: FYQ358R59X
        # One capability: Sign in with Apple. Without the entitlement the sheet never opens,
        # and since this project has no custom SMTP it is the only way a new person gets in
        # that does not depend on Supabase's shared mail server delivering.
        #
        # It lives in `Config/`, outside the synchronised group, and that location is the fix
        # for a bug that came back four times. `Sycamore/` is a
        # `PBXFileSystemSynchronizedRootGroup`: it takes everything under it as target
        # membership by default, so while the entitlements sat in `Sycamore/Resources/` the only
        # thing keeping a signing file out of the shipped bundle was one line of
        # `membershipExceptions` in the pbxproj — which Xcode rewrote away on four separate
        # occasions, silently, with no build error either time.
        #
        # An exception you have to keep restoring is not a fix. A file the group cannot see has
        # nothing to except.
        CODE_SIGN_ENTITLEMENTS: Config/Sycamore.entitlements
