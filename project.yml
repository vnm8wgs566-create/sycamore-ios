# XcodeGen spec for the Sycamore iOS app.
#
# `Sycamore.xcodeproj` is checked in and is the primary artefact; this file is the fallback
# for regenerating it from scratch:
#
#     brew install xcodegen && xcodegen generate
#
# Keep the two in step — bundle id, deployment target, Info.plist path and device family are
# duplicated between them by necessity.

name: Sycamore

options:
  bundleIdPrefix: com.cjgimena
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "1600"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # No SWIFT_STRICT_CONCURRENCY here on purpose: SWIFT_VERSION 6.0 already implies
    # complete checking, and stating it separately is what let this file drift out of
    # step with the checked-in pbxproj, which sets only SWIFT_VERSION.

targets:
  Sycamore:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    # `Config/` is deliberately not a source. The Info.plist and the entitlements are consumed by
    # *path* — `INFOPLIST_FILE` and `CODE_SIGN_ENTITLEMENTS` below — and never by target
    # membership, so the only thing including them here could do is ship a second copy inside
    # the .app. See the note on `CODE_SIGN_ENTITLEMENTS` for why they had to leave `Sycamore/`.
    sources:
      - path: Sycamore
        excludes:
          # Instructions for dropping the Manrope faces in — documentation, not a resource.
          # Without this the synchronised group ships it inside the .app. This one stays: its
          # whole point is to sit where the fonts go, and a stray README in the bundle is a
          # kilobyte of nothing rather than a signing claim.
          - "Resources/Fonts/README.md"

    settings:
      base:
        PRODUCT_NAME: Sycamore
        # PRODUCT_BUNDLE_IDENTIFIER, DEVELOPMENT_TEAM and CODE_SIGN_ENTITLEMENTS are not here.
        # They belong to whoever is building rather than to the project, so they live in
        # `Config/Signing.xcconfig` — see `configFiles` below. Setting them here as well would
        # be worse than redundant: a target-level build setting overrides the xcconfig, so the
        # per-developer override would silently stop working.
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # 1 = iPhone. The design is portrait phone only.
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_STYLE: Automatic
        # The catalog holds exactly one thing — the 3e mark at 1024, regenerated by
        # Scripts/make-app-icon.py. iOS masks the corners, so the PNG is a full square.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    # The three signing settings, and the `#include?` of a gitignored local override that lets a
    # second developer build the same commit under their own Apple ID. Both configurations point
    # at the one file — nothing in it varies by Debug or Release.
    #
    # The entitlements path it sets is `Config/Sycamore.entitlements`, outside the synchronised
    # group, and that location is the fix for a bug that came back four times. `Sycamore/` is a
    # `PBXFileSystemSynchronizedRootGroup`: it takes everything under it as target membership by
    # default, so while the entitlements sat in `Sycamore/Resources/` the only thing keeping a
    # signing file out of the shipped bundle was one line of `membershipExceptions` in the
    # pbxproj — which Xcode rewrote away on four separate occasions, silently, with no build
    # error either time.
    #
    # An exception you have to keep restoring is not a fix. A file the group cannot see has
    # nothing to except.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
