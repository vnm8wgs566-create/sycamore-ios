<sc-if value="{{ shNewCamp }}" hint-placeholder-val="{{ false }}">
        <div style="font:600 12.5px 'Instrument Sans',sans-serif;letter-spacing:-.01em;color:#71757E;margin:16px 0 7px">Camp name</div>
        <input value="{{ dName }}" onInput="{{ setDName }}" placeholder="UCLA Tennis Camp" style="width:100%;box-sizing:border-box;border:1.5px solid #0B0B0C;border-radius:15px;padding:14px 15px;font:600 16px 'Instrument Sans',sans-serif;letter-spacing:-.02em;background:#fff">
        <div style="font:400 12.5px/1.55 'Instrument Sans',sans-serif;color:#A2A6AE;margin-top:12px">Venues, groups and kids come next — season and everything else live on the Camp tab.</div>
        <div onClick="{{ createCamp }}" style="height:56px;border-radius:16px;background:#1A7F55;color:#fff;display:flex;align-items:center;justify-content:center;font:600 16px 'Instrument Sans',sans-serif;letter-spacing:-.015em;margin-top:14px;cursor:pointer;opacity:{{ ctaOpacity }}">{{ createLabel }}</div>
      </sc-if>
